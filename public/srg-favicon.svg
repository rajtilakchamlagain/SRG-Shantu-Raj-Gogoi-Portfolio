<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Dark Background Disk for high contrast on light/dark browser tabs -->
  <circle cx="50" cy="50" r="48" fill="#070b14" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Technical Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#bgGrad)" stroke-width="3" stroke-dasharray="4 2"/>

  <!-- Technical Mechanical Marks -->
  <line x1="50" y1="4" x2="50" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="88" x2="50" y2="96" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="4" y1="50" x2="12" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="50" x2="96" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- SRG Aerodynamic Swirl 1 -->
  <path d="M 50 18 A 32 32 0 0 1 82 50 C 82 61 74 70 64 70 C 54 70 49 61 45 55 C 41 49 36 43 26 43 C 20 43 18 47 18 50 A 32 32 0 0 1 50 18 Z" fill="url(#bgGrad)" />

  <!-- SRG Aerodynamic Swirl 2 -->
  <path d="M 50 82 A 32 32 0 0 1 18 50 C 18 39 26 30 36 30 C 46 30 51 39 55 45 C 59 51 64 57 74 57 C 80 57 82 53 82 50 A 32 32 0 0 1 50 82 Z" fill="url(#arcGrad)" />

  <!-- Center Core Pivot -->
  <circle cx="50" cy="50" r="5" fill="#ffffff"/>
</svg>
